title: Organise ta veille technologique
description: Suivez les dernières nouvelles, articles et tutoriels dans le domaine du développement logiciel, le tout en un seul endroit pratique.
hero:
  links:
    - label: Démarrer
      icon: i-lucide-arrow-right
      trailing: true
      color: primary
      to: /dashboard
      size: xl
    - label: GitHub
      icon: i-simple-icons-github
      size: xl
      color: neutral
      variant: outline
      to: https://github.com/paulbreton/my-dashboard
      target: _blank
section:
  title: '[Révolutionnez]{.text-primary} votre expérience de veille'
  description: My Dashboard est une application, conçue pour les développeurs, qui centralise votre veille technologique et améliore votre productivité grâce à des fonctionnalités intelligentes.
  images:
    mobile: '/images/home/macbook-mobile.svg'
    desktop: '/images/home/macbook.svg'
  features:
    - title: Organise ton temps
      description: Ajoute des tâches, définis des rappels et suis tes progrès. Reste organisé et maximise ta productivité avec une gestion du temps simplifiée.
      class: border-l border-primary pl-4
    - title: Ajoute des sources rss
      description: Intègre facilement tes flux RSS préférés pour rester à jour avec les dernières actualités et articles de développement.
      class: border-l border-default pt-4 pl-4
    - title: Résumé intelligent
      description: L'application utilise l'IA pour générer des résumés concis des articles longs, te permettant de saisir rapidement les points clés sans perdre de temps.
      class: border-l border-default pt-4 pl-4
steps:
  title: My [Dashboard]{.text-primary}
  description: Dévelloper en Nuxt 4, tailwindcss et supabase pour le stockage des données.
  items:
    - title: Nuxt 4
      description: Le framework de choix pour construire des applications Vue.js performantes et évolutives.
      image:
        light: '/images/home/nuxt.svg'
        dark: '/images/home/nuxt.svg'
    - title: Nuxt Ui
      description: Une bibliothèque de composants UI moderne et réactive conçue spécifiquement pour Nuxt.js, offrant une intégration transparente et une expérience utilisateur exceptionnelle.
      image:
        light: '/images/home/nuxt-ui.svg'
        dark: '/images/home/nuxt-ui.svg'
    - title: Supabase
      description: Une plateforme backend open-source qui fournit une base de données, une authentification et un stockage en temps réel, facilitant le développement d'applications modernes.
      image:
        light: '/images/home/track.svg'
        dark: '/images/home/track.svg'
cta:
  title: Si tu es prêt à rejoindre la révolution
  description: Commencez votre voyage vers une productivité de codage inégalée aujourd'hui avec notre plateforme alimentée par l'IA.
  links:
    - label: Se connecter
      to: '/login'
      icon: i-lucide-lock-open
    - label: GitHub
      to: 'https://github.com/nuxt-ui-templates/landing'
      target: _blank
      variant: subtle
      icon: i-simple-icons-github
